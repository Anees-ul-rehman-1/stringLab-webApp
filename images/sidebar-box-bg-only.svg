<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Base card gradient (purple -> deep indigo/black) -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b1e78"/>
      <stop offset="55%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0a0a18"/>
    </linearGradient>

    <!-- Glow blob gradients -->
    <radialGradient id="glowPurple" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowPink" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowOrange" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#f97316" stop-opacity="0"/>
    </radialGradient>

    <!-- Abstract soft blob shape gradient -->
    <linearGradient id="blobGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.15"/>
    </linearGradient>

    <filter id="blurHeavy" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>

    <filter id="blurBlob" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <!-- Rounded card base -->
  <rect x="0" y="0" width="400" height="400" rx="28" fill="url(#cardBg)"/>

  <!-- Blurred glow blobs floating in background -->
  <circle cx="130" cy="120" r="90" fill="url(#glowPurple)" filter="url(#blurHeavy)"/>
  <circle cx="280" cy="90" r="70" fill="url(#glowPink)" filter="url(#blurHeavy)"/>
  <circle cx="290" cy="220" r="80" fill="url(#glowOrange)" filter="url(#blurHeavy)"/>
  <circle cx="150" cy="230" r="60" fill="url(#glowPink)" filter="url(#blurHeavy)"/>

  <!-- Extra abstract soft blob shape (organic freeform, sits behind where console will go) -->
  <path d="M 130 220
           C 90 190, 95 130, 150 110
           C 205 90, 270 110, 285 165
           C 300 220, 260 270, 205 275
           C 150 280, 170 250, 130 220 Z"
        fill="url(#blobGrad)" filter="url(#blurBlob)"/>

  <!-- Scattered sparkle stars -->
  <g fill="#ffffff">
    <path d="M60 60 L66 76 L82 82 L66 88 L60 104 L54 88 L38 82 L54 76 Z" opacity="0.9"/>
    <path d="M330 130 L334 141 L345 145 L334 149 L330 160 L326 149 L315 145 L326 141 Z" opacity="0.8"/>
    <path d="M100 250 L103 258 L111 261 L103 264 L100 272 L97 264 L89 261 L97 258 Z" opacity="0.7"/>
    <path d="M300 260 L304 270 L314 274 L304 278 L300 288 L296 278 L286 274 L296 270 Z" opacity="0.6"/>
    <circle cx="200" cy="70" r="3" opacity="0.6"/>
    <circle cx="340" cy="220" r="2.5" opacity="0.5"/>
    <circle cx="70" cy="180" r="2.5" opacity="0.5"/>
  </g>
</svg>
